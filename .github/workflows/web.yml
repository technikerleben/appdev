name: Küchenblatt Webapp

on:
  push:
    paths:
      - "api/**"
      - "lib/**"
      - "tests/**"
      - "trmnl-recipe/**"
      - "package.json"
      - "package-lock.json"
      - "vercel.json"
      - ".github/workflows/web.yml"
  pull_request:
    paths:
      - "api/**"
      - "lib/**"
      - "tests/**"
      - "trmnl-recipe/**"
      - "package.json"
      - "package-lock.json"
      - "vercel.json"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm test

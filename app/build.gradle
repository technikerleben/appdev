plugins {
    id 'com.android.application'
}

def releaseProperties = new Properties()
def localPropertiesFile = rootProject.file('local.properties')
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { releaseProperties.load(it) }
}

def signingValue = { String propertyName, String environmentName ->
    def value = releaseProperties.getProperty(propertyName)
    value != null && !value.trim().isEmpty() ? value : System.getenv(environmentName)
}

def releaseStoreFile = signingValue('release.storeFile', 'EPUB_RELEASE_STORE_FILE')
def releaseStorePassword = signingValue('release.storePassword', 'EPUB_RELEASE_STORE_PASSWORD')
def releaseKeyAlias = signingValue('release.keyAlias', 'EPUB_RELEASE_KEY_ALIAS')
def releaseKeyPassword = signingValue('release.keyPassword', 'EPUB_RELEASE_KEY_PASSWORD')
def releaseSigningReady = [releaseStoreFile, releaseStorePassword, releaseKeyAlias, releaseKeyPassword].every { it }
def allowUnsignedRelease = 'true'.equalsIgnoreCase(System.getenv('EPUB_ALLOW_UNSIGNED_RELEASE'))

android {
    namespace 'de.technikerleben.epubreader'
    compileSdk 35

    buildFeatures {
        buildConfig true
    }

    defaultConfig {
        applicationId 'de.technikerleben.epubreader'
        minSdk 26
        targetSdk 35
        versionCode 10
        versionName '1.4.1'
    }

    signingConfigs {
        if (releaseSigningReady) {
            release {
                storeFile rootProject.file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
                enableV2Signing true
                enableV3Signing true
            }
        }
    }

    buildTypes {
        release {
            if (releaseSigningReady) signingConfig signingConfigs.release
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}

gradle.taskGraph.whenReady { graph ->
    def releaseRequested = graph.allTasks.any { it.name.toLowerCase(Locale.ROOT).contains('release') }
    if (releaseRequested && !releaseSigningReady && !allowUnsignedRelease) {
        throw new GradleException('Release-Signierung fehlt. release.* in local.properties oder EPUB_RELEASE_* setzen.')
    }
}

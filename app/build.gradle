plugins {
    id 'com.android.application'
}

android {
    namespace 'de.technikerleben.epubreader'
    compileSdk 35

    defaultConfig {
        applicationId 'de.technikerleben.epubreader'
        minSdk 26
        targetSdk 35
        versionCode 6
        versionName '1.2.1'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }
}
